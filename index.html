<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AA记账</title>
<style>
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --primary: #00b4d8;
  --primary-dark: #0096c7;
  --primary-light: #e0f7fa;
  --danger: #ff3b30;
  --success: #34c759;
  --warning: #ff9500;
  --text: #1a1a2e;
  --text-secondary: #8e8e93;
  --border: #e5e5ea;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 8px rgba(0,0,0,0.06);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 80px;
  min-height: 100vh;
}
.page { display: none; }
.page.active { display: block; }

/* ========== 通用组件 ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 14px 24px; border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 600; cursor: pointer;
  width: 100%; transition: opacity .2s;
}
.btn:active { opacity: .7; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn-success { background: var(--success); color: #fff; }
.input {
  width: 100%; padding: 14px 16px;
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-size: 16px; background: #fff; outline: none;
  transition: border-color .2s;
}
.input:focus { border-color: var(--primary); }
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(245,246,248,0.92);
  backdrop-filter: blur(12px);
  padding: 14px 16px 10px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 17px; font-weight: 600; flex: 1; color: var(--text); }
.header .back { font-size: 22px; cursor: pointer; padding: 4px 4px 4px 0; border: none; background: none; color: var(--primary); }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.tabs {
  display: flex; gap: 0; background: var(--card);
  border-radius: var(--radius); overflow: hidden;
  margin-bottom: 16px; border: 1px solid var(--border);
}
.tab {
  flex: 1; padding: 12px; text-align: center;
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all .2s; border: none; background: transparent; color: var(--text-secondary);
}
.tab.active { background: var(--primary); color: #fff; font-weight: 600; }

/* ========== Login ========== */
#page-login { padding: 60px 24px 0; min-height: 100vh; }
#page-login .inner { display: flex; flex-direction: column; max-width: 400px; margin: 0 auto; }
#page-login .logo { font-size: 42px; text-align: center; margin-bottom: 8px; }
#page-login h2 { text-align: center; font-size: 28px; margin-bottom: 4px; }
#page-login p.sub { text-align: center; color: var(--text-secondary); margin-bottom: 40px; }
#page-login .input { margin-bottom: 12px; }
#page-login .btn { margin-bottom: 12px; }
#page-login .switch-link { text-align: center; font-size: 14px; color: var(--primary); cursor: pointer; margin-top: 8px; }

/* ========== Home ========== */
#page-home .project-list { padding: 16px 20px; }
.project-item {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; margin-bottom: 10px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); cursor: pointer; transition: all .15s;
}
.project-item:active { transform: scale(.97); opacity: .8; }
.project-item .emoji { width: 44px; height: 44px; border-radius: 12px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.project-item .info { flex: 1; min-width: 0; }
.project-item .info h3 { font-size: 16px; font-weight: 600; color: var(--text); }
.project-item .info p { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.project-item .amount { font-size: 18px; font-weight: 700; color: var(--primary); }
.join-section { padding: 8px 20px 16px; display: flex; gap: 8px; }
.join-section .input { flex: 1; padding: 12px 14px; font-size: 14px; border-radius: var(--radius); border: 2px solid var(--border); }
.join-section .btn { width: auto; padding: 12px 20px; white-space: nowrap; border-radius: var(--radius); font-size: 14px; }

/* ========== Room ========== */
.room-summary {
  margin: 12px 16px; border-radius: 16px; padding: 20px;
  background: linear-gradient(135deg, #00b4d8, #0077b6);
  color: #fff; position: relative; overflow: hidden;
}
.room-summary::after {
  content: ''; position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  background: rgba(255,255,255,.08);
  border-radius: 50%;
  pointer-events: none;
}
.room-summary .label-row { display: flex; justify-content: space-between; align-items: center; }
.room-summary .label-row .label { font-size: 13px; opacity: .85; }
.room-summary .label-row .settle-btn {
  font-size: 13px; opacity: .9; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,.2); padding: 6px 12px;
  border-radius: 20px; border: none; color: #fff;
}
.room-summary .amount-row { display: flex; align-items: baseline; gap: 4px; margin-top: 8px; }
.room-summary .amount-row .currency { font-size: 16px; opacity: .85; }
.room-summary .amount-row .total { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
.room-summary .per-person { font-size: 13px; opacity: .7; margin-top: 4px; }
.room-summary .members { display: flex; gap: -4px; margin-top: 14px; }
.room-summary .members .avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; border: 2px solid rgba(255,255,255,.4);
  margin-right: -6px; cursor: pointer;
}
.room-actions { display: flex; gap: 8px; padding: 0 20px 12px; }
.room-actions .btn { flex: 1; font-size: 14px; padding: 12px; }

.bill-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; margin-bottom: 8px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); cursor: pointer; transition: transform .1s;
}
.bill-item:active { transform: scale(.98); }
.bill-item .type-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.bill-item .type-icon.food { background: #fff2e0; }
.bill-item .type-icon.transport { background: #e0f0ff; }
.bill-item .type-icon.hotel { background: #e8f5e9; }
.bill-item .type-icon.ticket { background: #fce4ec; }
.bill-item .type-icon.shopping { background: #f3e5f5; }
.bill-item .type-icon.other { background: #f5f5f5; }
.bill-item .info { flex: 1; min-width: 0; }
.bill-item .info .top { display: flex; justify-content: space-between; align-items: center; }
.bill-item .info .top .name { font-weight: 600; font-size: 15px; color: var(--text); }
.bill-item .info .top .cost { font-weight: 700; font-size: 16px; color: var(--text); }
.bill-item .info .meta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

/* ========== Bill Form ========== */
.bill-form { padding: 16px 20px; }
.bill-form .amount-input {
  font-size: 48px; font-weight: 800; text-align: center;
  width: 100%; padding: 20px; border: none; background: transparent;
  outline: none; color: var(--text); pointer-events: none;
}
.bill-form .amount-hint { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
.bill-form .label { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; margin-top: 16px; }
.tag-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-grid .tag {
  padding: 8px 16px; border-radius: 20px; border: 2px solid var(--border);
  background: #fff; font-size: 14px; cursor: pointer; transition: all .2s;
}
.tag-grid .tag.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }

/* 数字键盘 */
.numpad {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
  background: #d1d5db; padding: 6px 4px env(safe-area-inset-bottom, 8px);
  display: none; grid-template-columns: repeat(4, 1fr); gap: 4px;
  max-width: 500px; margin: 0 auto;
}
.numpad-key {
  height: 54px; border: none; border-radius: 8px;
  font-size: 22px; font-weight: 500; cursor: pointer;
  background: #fff; color: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
}
.numpad-key:active { background: #e5e5ea; }
.numpad-key.fn { background: #a1a1aa; color: #fff; font-size: 16px; }
.numpad-key.fn:active { background: #71717a; }
.numpad-key.confirm { background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; }
.numpad-key.confirm:active { background: var(--primary-dark); }
.numpad-key.dot { font-weight: 700; }

.payer-row, .split-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  min-height: 44px; padding: 8px 12px;
  background: #fff; border: 2px solid var(--border);
  border-radius: var(--radius-sm); margin-bottom: 12px;
}
.payer-row .avatar, .split-row .avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--primary-light); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; border: 2px solid var(--primary);
  cursor: pointer;
}
.add-circle {
  width: 34px; height: 34px; border-radius: 50%;
  background: #f0f0f5; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 300; border: 2px dashed var(--border);
  cursor: pointer; transition: all .2s;
}
.add-circle:active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.split-all-check { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; cursor: pointer; }
.split-all-check input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
.bill-section { margin-bottom: 16px; }
.bill-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); padding: 8px 4px 4px; margin-bottom: 4px; }

/* ========== Settle ========== */
.settle-summary {
  padding: 20px; text-align: center;
  background: linear-gradient(135deg, #34c759, #007aff);
  color: #fff;
}
.settle-summary .total { font-size: 36px; font-weight: 800; margin: 8px 0; }
.settle-summary .per-person { font-size: 18px; opacity: .9; }
.settle-detail { padding: 16px 20px; }
.person-card {
  background: var(--card); border-radius: var(--radius);
  padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow);
}
.person-card .header {
  display: flex; justify-content: space-between; align-items: center;
  position: static; padding: 0; margin-bottom: 8px;
  border: none; background: transparent; backdrop-filter: none;
}
.person-card .header .name { font-weight: 700; font-size: 16px; }
.person-card .header .status { font-size: 14px; }
.person-card .header .status.get { color: var(--danger); }
.person-card .header .status.pay { color: var(--success); }
.person-card .details { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
.transfer-list { padding: 0 20px; }
.transfer-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--card); border-radius: var(--radius);
  margin-bottom: 8px; box-shadow: var(--shadow);
}
.transfer-item .arrow { font-size: 20px; color: var(--text-secondary); }
.transfer-item .from { font-weight: 600; }
.transfer-item .to { font-weight: 600; }
.transfer-item .amount { font-weight: 700; color: var(--primary); margin-left: auto; font-size: 18px; }

/* ========== Admin ========== */
.admin-table { padding: 16px 20px; }
.admin-table .row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
.admin-table .row:last-child { border-bottom: none; }
.admin-table .row .name { font-weight: 500; }
.admin-table .row .email { font-size: 12px; color: var(--text-secondary); }
.admin-table .row .role { font-size: 12px; padding: 2px 8px; border-radius: 12px; }
.admin-table .row .role.admin { background: #fff2e0; color: #e68a00; }
.admin-table .row .role.user { background: #f0f0f5; color: #666; }

/* ========== Logs ========== */
.log-list { padding: 16px 20px; }
.log-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.6; display: flex; gap: 8px; }
.log-item .time { color: var(--text-secondary); white-space: nowrap; min-width: 60px; }
.log-item .content { flex: 1; }

/* ========== Bottom Nav ========== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 64px; background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px); border-top: 1px solid var(--border);
  display: flex; align-items: center; z-index: 100;
  padding: 0 16px var(--safe-bottom);
  justify-content: space-around;
}
.bottom-nav button {
  border: none; background: transparent;
  font-size: 11px; color: var(--text-secondary); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 6px 16px; transition: color .2s;
  position: relative;
}
.bottom-nav button .icon { font-size: 22px; }
.bottom-nav button.active { color: var(--primary); font-weight: 600; }
.bottom-nav .nav-fab {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 28px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,180,216,0.5);
  margin-top: -20px; transition: transform .2s, opacity .2s;
  position: relative;
}
.bottom-nav .nav-fab:active { transform: scale(.9); }
.bottom-nav .nav-fab.hidden { opacity: 0; pointer-events: none; }

/* ========== Modal ========== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: #fff; border-radius: var(--radius) var(--radius) 0 0;
  padding: 24px 20px; width: 100%; max-width: 500px;
  max-height: 80vh; overflow-y: auto;
  animation: slideUp .3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-content h3 { font-size: 18px; margin-bottom: 16px; }

/* ========== Avatar Picker ========== */
.avatar-grid {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 8px 0;
}
.avatar-option {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; border: 3px solid transparent;
  transition: all .2s;
}
.avatar-option.selected { border-color: var(--primary); transform: scale(1.1); }
.avatar-option:active { transform: scale(.9); }

/* ========== Emoji Grid ========== */
.emoji-grid {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 4px 0;
}
.emoji-opt {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; border: 2px solid var(--border);
  background: #fff; transition: all .2s;
}
.emoji-opt.selected { border-color: var(--primary); background: var(--primary-light); transform: scale(1.1); }
.emoji-opt:active { transform: scale(.9); }

/* Toast */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.8); color: #fff; padding: 12px 24px;
  border-radius: 24px; font-size: 14px; z-index: 300;
  display: none; animation: fadeIn .3s;
}
.toast.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

@media (min-width: 600px) {
  body { max-width: 480px; margin: 0 auto; background: #e5e5ea; }
}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-content" id="modal-content"></div>
</div>

<!-- ========== PAGE: Login ========== -->
<div id="page-login" class="page">
  <div class="inner">
    <div class="logo">💰</div>
    <h2>AA记账</h2>
    <p class="sub">好友出游，分摊无忧</p>
    <div id="login-form">
      <input class="input" id="login-user" type="text" placeholder="用户名" autocomplete="username">
      <input class="input" id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn btn-primary" onclick="handleLogin()">登 录</button>
      <div class="switch-link" onclick="showRegister()">没有账号？去注册</div>
      <div class="switch-link" style="font-size:12px;color:var(--text-secondary);margin-top:4px;" onclick="showForgot()">忘记密码？</div>
    </div>
    <div id="register-form" style="display:none;">
      <input class="input" id="reg-user" type="text" placeholder="用户名">
      <input class="input" id="reg-email" type="email" placeholder="邮箱（可选）">
      <input class="input" id="reg-pass" type="password" placeholder="密码">
      <input class="input" id="reg-pass2" type="password" placeholder="确认密码">
      <button class="btn btn-primary" onclick="handleRegister()">注 册</button>
      <div class="switch-link" onclick="showLogin()">已有账号？去登录</div>
    </div>
    <div id="forgot-form" style="display:none;">
      <input class="input" id="forgot-email" type="email" placeholder="输入注册邮箱">
      <button class="btn btn-primary" onclick="handleForgot()">发送重置邮件</button>
      <div class="switch-link" onclick="showLogin()">返回登录</div>
    </div>
  </div>
</div>

<!-- ========== PAGE: Home ========== -->
<div id="page-home" class="page">
  <div style="padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center;">
    <div>
      <div style="font-size:24px;font-weight:800;color:var(--text);">你好呀</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;" id="home-greeting"></div>
    </div>
    <div style="width:40px;height:40px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary);font-weight:600;" id="home-avatar">G</div>
  </div>
  <div class="join-section">
    <input class="input" id="join-code" placeholder="输入分享码加入" style="text-transform:uppercase;">
    <button class="btn btn-primary" onclick="handleJoin()">加入</button>
  </div>
  <div class="project-list" id="project-list"></div>
</div>

<!-- ========== PAGE: Create Project ========== -->
<div id="page-project-new" class="page">
  <div class="header">
    <button class="back" onclick="navigate('#home')">←</button>
    <h1>创建项目</h1>
  </div>
  <div style="padding:20px;">
    <input class="input" id="new-name" placeholder="项目名称，如：2026年5月露营" style="margin-bottom:12px;">
    <input class="input" id="new-date" type="month" style="margin-bottom:16px;">
    <div class="label" style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">项目图标</div>
    <div class="emoji-grid" id="project-emoji-grid"></div>
    <button class="btn btn-primary" onclick="handleCreateProject()" style="margin-top:20px;">创建并进入</button>
  </div>
</div>

<!-- ========== PAGE: Room ========== -->
<div id="page-room" class="page">
  <div class="header">
    <button class="back" onclick="navigate('#home')">←</button>
    <div style="flex:1;display:flex;align-items:center;gap:6px;">
      <span id="room-emoji" style="font-size:18px;"></span>
      <h1 id="room-title" style="flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">项目名称</h1>
      <span id="room-rename-btn" style="font-size:15px;cursor:pointer;padding:2px 4px;" onclick="showRenameModal()">✏️</span>
    </div>
    <button style="border:none;background:none;font-size:14px;color:var(--primary);font-weight:600;" onclick="shareRoom()">分享</button>
  </div>
  <div class="room-summary">
    <div class="label-row">
      <span class="label">我的支出</span>
      <button class="settle-btn" onclick="navigateToSettle()">全员结算 →</button>
    </div>
    <div class="amount-row">
      <span class="currency">¥</span>
      <span class="total" id="room-total">0</span>
    </div>
    <div class="per-person" id="room-perperson">人均 ¥0</div>
    <div id="room-category-summary" style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;"></div>
    <div class="members" id="room-members"></div>
  </div>
  <div onclick="navigate('#logs')" style="padding:3px 20px 8px;font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;cursor:pointer;">
    📋 操作记录 <span style="font-size:10px;">→</span>
  </div>
  <div id="bill-list" style="padding:0 16px 80px;"></div>
</div>

<script>
// ============================================
// 本地持久化 (localStorage)
// ============================================
const STORAGE_KEY = 'aa_app_data';

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      DB.users = saved.users || DB.users;
      DB.projects = saved.projects || DB.projects;
      if (saved.currentUserId) {
        const found = DB.users.find(u => u.id === saved.currentUserId);
        if (found) DB.currentUser = found;
      }
    }
  } catch(e) { console.warn('loadDB error:', e); }
}

function saveDB() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      users: DB.users,
      projects: DB.projects,
      currentUserId: DB.currentUser ? DB.currentUser.id : null
    }));
  } catch(e) { console.warn('saveDB error:', e); }
}

// ============================================
// 数据层
// ============================================
const DB = {
  currentUser: null,
  users: [
    { id: 'u1', username: 'GG', email: 'gg@test.com', password: '123', role: 'admin', zelle: 'gg@bank.com', avatar: 'G', avatarBg: '#e0f7fa' },
    { id: 'u2', username: '小王', email: 'xw@test.com', password: '123', role: 'user', zelle: 'xw@pay.com', avatar: '小', avatarBg: '#fff2e0' },
  ],
  projects: [
    {
      id: 'p1', name: '2026年5月露营', date: '2026-05', code: 'zxvf',
      createdBy: 'u1', settled: false,
      members: ['u1', 'u2'],
      bills: [
        { id: 'b1', amount: 300, tag: '餐饮', payer: 'u1', payers: ['u1'], split: ['u1','u2'], note: '火锅', createdAt: '2026-05-18 20:30' },
        { id: 'b2', amount: 120, tag: '交通', payer: 'u2', payers: ['u2'], split: ['u1','u2'], note: '打车去营地', createdAt: '2026-05-18 20:35' },
      ],
      logs: [
        { time: '05-18 20:30', text: 'GG 创建了项目' },
        { time: '05-18 20:30', text: '小王 加入了项目' },
        { time: '05-18 20:31', text: 'GG 添加了账单「火锅 ¥300」' },
      ]
    }
  ]
};

// 头像列表
const AVATAR_OPTIONS = [
  { char: 'G', bg: '#e0f7fa', color: '#00b4d8' },
  { char: '小', bg: '#fff2e0', color: '#e68a00' },
  { char: '李', bg: '#fce4ec', color: '#c62828' },
  { char: '王', bg: '#e8f5e9', color: '#2e7d32' },
  { char: '张', bg: '#f3e5f5', color: '#7b1fa2' },
  { char: '刘', bg: '#e0f0ff', color: '#007aff' },
  { char: '陈', bg: '#fff8e1', color: '#f9a825' },
  { char: '杨', bg: '#f1f8e9', color: '#689f38' },
  { char: '赵', bg: '#fbe9e7', color: '#d84315' },
  { char: '黄', bg: '#e4f1fe', color: '#1565c0' },
  { char: '周', bg: '#fce4ec', color: '#e91e63' },
  { char: '吴', bg: '#e8f5e9', color: '#388e3c' },
  { char: '🐱', bg: '#f3e5f5', color: '#9c27b0' },
  { char: '🐶', bg: '#fff3e0', color: '#ff6f00' },
  { char: '🐰', bg: '#fce4ec', color: '#d81b60' },
  { char: '🦊', bg: '#fff8e1', color: '#f57f17' },
];

// ============================================
// Router
// ============================================
function navigate(hash) {
  window.location.hash = hash;
  renderRoute();
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('load', () => {
  loadDB();
  if (!window.location.hash || window.location.hash === '#') window.location.hash = '#login';
  renderRoute();
});

function renderRoute() {
  const hash = window.location.hash || '#login';

  if (!DB.currentUser && !hash.startsWith('#login') && !hash.startsWith('#forgot') && !hash.startsWith('#register')) {
    navigate('#login');
    return;
  }

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  const nav = document.getElementById('bottom-nav');
  const showNavPages = ['#home', '#room', '#settle', '#admin', '#bill', '#logs'];
  const shouldShowNav = DB.currentUser && showNavPages.some(h => hash.startsWith(h));
  nav.style.display = shouldShowNav ? 'flex' : 'none';

  // 底部 + 号: 在记账页面隐藏
  const fabBtn = document.getElementById('nav-fab-btn');
  if (fabBtn) {
    if (hash.includes('/add') || hash.includes('/detail/')) {
      fabBtn.classList.add('hidden');
    } else {
      fabBtn.classList.remove('hidden');
      if (hash.startsWith('#room/')) {
        fabBtn.onclick = navigateToAddBill;
      } else if (hash.startsWith('#settle/')) {
        fabBtn.onclick = navigateToAddBill;
      } else {
        fabBtn.onclick = () => navigate('#project/new');
      }
    }
  }

  if (hash.startsWith('#login') || hash.startsWith('#register') || hash.startsWith('#forgot')) {
    document.getElementById('page-login').classList.add('active');
    if (hash === '#register') showRegister();
    else if (hash === '#forgot') showForgot();
    else showLogin();
  }
  else if (hash === '#home') { document.getElementById('page-home').classList.add('active'); renderHome(); }
  else if (hash === '#project/new') { document.getElementById('page-project-new').classList.add('active'); document.getElementById('new-date').value = new Date().toISOString().slice(0,7); initProjectEmoji(); }
  else if (hash.startsWith('#room/')) { document.getElementById('page-room').classList.add('active'); renderRoom(); }
  else if (hash.startsWith('#bill/') && hash.includes('/add')) { document.getElementById('page-add-bill').classList.add('active'); initAddBill(); }
  else if (hash.startsWith('#bill/') && hash.includes('/detail/')) { document.getElementById('page-bill-detail').classList.add('active'); renderBillDetail(); }
  else if (hash.startsWith('#settle')) { document.getElementById('page-settle').classList.add('active'); renderSettle(); }
  else if (hash === '#logs') { document.getElementById('page-logs').classList.add('active'); renderLogs(getCurrentProjectId() || window._currentPid); }
  else if (hash === '#admin') { document.getElementById('page-admin').classList.add('active'); renderAdmin(); }
  else if (hash === '#account') { document.getElementById('page-account').classList.add('active'); renderAccount(); }
}

function getCurrentProjectId() {
  const hash = window.location.hash;
  const m = hash.match(/room\/([^/]+)/) || hash.match(/bill\/([^/]+)/) || hash.match(/settle\/([^/]+)/);
  return m ? m[1] : null;
}
function findProject(id) { return DB.projects.find(p => p.id === id); }
function findUser(id) { return DB.users.find(u => u.id === id); }
function findUserByName(name) { return DB.users.find(u => u.username === name); }

// ============================================
// 登录 / 注册
// ============================================
function showLogin() {
  document.getElementById('login-form').style.display = '';
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('forgot-form').style.display = 'none';
  document.querySelector('#page-login h2').textContent = 'AA记账';
}
function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = '';
  document.getElementById('forgot-form').style.display = 'none';
  document.querySelector('#page-login h2').textContent = '注册';
}
function showForgot() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('forgot-form').style.display = '';
  document.querySelector('#page-login h2').textContent = '找回密码';
}

function handleLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  const found = DB.users.find(u => u.username === user && u.password === pass);
  if (found) {
    DB.currentUser = found;
    saveDB();
    showToast('登录成功');
    navigate('#home');
  } else {
    showToast('用户名或密码错误');
  }
}

function handleRegister() {
  const user = document.getElementById('reg-user').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value.trim();
  const pass2 = document.getElementById('reg-pass2').value.trim();
  if (!user) return showToast('请输入用户名');
  if (pass !== pass2) return showToast('两次密码不一致');
  if (DB.users.find(u => u.username === user)) return showToast('用户名已存在');
  const newUser = { id: 'u' + Date.now(), username: user, email, password: pass, role: 'user', zelle: '', avatar: user.charAt(0), avatarBg: '#e0f7fa' };
  DB.users.push(newUser);
  saveDB();
  showToast('注册成功，请登录');
  showLogin();
}

function handleForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  const found = DB.users.find(u => u.email === email);
  if (found) showToast('重置链接已发送到你的邮箱（演示模式）');
  else showToast('未找到该邮箱');
}

function logout() {
  DB.currentUser = null;
  saveDB();
  navigate('#login');
}

// ============================================
// Home
// ============================================
function renderHome() {
  const list = document.getElementById('project-list');
  const user = DB.currentUser;
  if (user) {
    document.getElementById('home-greeting').textContent = user.username + '，你有 ' + DB.projects.filter(p => p.members.includes(user.id)).length + ' 个项目';
    const avatarChar = user.avatar || user.username.charAt(0);
    document.getElementById('home-avatar').textContent = avatarChar;
    document.getElementById('home-avatar').style.background = user.avatarBg || 'var(--primary-light)';
  }
  const myProjects = DB.projects.filter(p => p.members.includes(DB.currentUser.id));
  if (myProjects.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:60px 0;">还没有项目，点右下角 ＋ 创建一个</p>';
    return;
  }
  list.innerHTML = myProjects.map(p => {
    const total = p.bills.reduce((s, b) => s + b.amount, 0);
    return `<div class="project-item" onclick="navigate('#room/${p.id}')">
      <div class="emoji">${p.emoji || '🏕️'}</div>
      <div class="info"><h3>${p.name}</h3><p>${p.members.length}人 · ${p.bills.length}笔</p></div>
      <div class="amount">¥${total}</div>
    </div>`;
  }).join('');
}

function handleJoin() {
  const code = document.getElementById('join-code').value.trim().toLowerCase();
  const p = DB.projects.find(pr => pr.code === code);
  if (!p) return showToast('未找到该分享码');
  if (p.members.includes(DB.currentUser.id)) return showToast('你已在项目中');
  p.members.push(DB.currentUser.id);
  p.logs.push({ time: formatTime(new Date()), text: DB.currentUser.username + ' 通过链接加入了项目' });
  saveDB();
  showToast('已加入项目');
  navigate('#room/' + p.id);
}

var selectedProjectEmoji = '🏕️';
var PROJECT_EMOJIS = ['🏕️','🎮','🍽️','🏖️','🎂','🏠','🚗','✈️','🎤','🏋️','🎄','❄️','🌸','🎉','🏫','🎬','🌊','⛰️','🍺','☕','📚','🎵','🛒','🎪'];

function initProjectEmoji() {
  selectedProjectEmoji = '🏕️';
  var grid = document.getElementById('project-emoji-grid');
  grid.innerHTML = PROJECT_EMOJIS.map(function(e) {
    return '<span class="emoji-opt' + (e === '🏕️' ? ' selected' : '') + '" onclick="selectProjectEmoji(this)">' + e + '</span>';
  }).join('');
}

function selectProjectEmoji(el) {
  document.querySelectorAll('#project-emoji-grid .emoji-opt').forEach(function(t) { t.classList.remove('selected'); });
  el.classList.add('selected');
  selectedProjectEmoji = el.textContent;
}

function handleCreateProject() {
  const name = document.getElementById('new-name').value.trim();
  const date = document.getElementById('new-date').value;
  if (!name) return showToast('请输入项目名称');
  const code = Math.random().toString(36).substring(2, 6).toLowerCase();
  const p = { id: 'p' + Date.now(), name, emoji: selectedProjectEmoji, date, code, createdBy: DB.currentUser.id, settled: false, members: [DB.currentUser.id], bills: [], logs: [{ time: formatTime(new Date()), text: DB.currentUser.username + ' 创建了项目「' + name + '」' }] };
  DB.projects.push(p);
  saveDB();
  showToast('项目已创建，分享码：' + code);
  navigate('#room/' + p.id);
}

// ============================================
// Room
// ============================================
var catEmojis = { '餐饮':'🍜', '交通':'🚗', '住宿':'🏨', '门票':'🎫', '购物':'🛍️', '其他':'📦' };
var catIconCls = { '餐饮':'food', '交通':'transport', '住宿':'hotel', '门票':'ticket', '购物':'shopping', '其他':'other' };

function renderRoom() {
  const pid = getCurrentProjectId();
  const p = findProject(pid);
  if (!p) return;
  window._currentPid = pid;
  document.getElementById('room-title').textContent = p.name;
  document.getElementById('room-emoji').textContent = p.emoji || '🏕️';

  const total = p.bills.reduce((s, b) => s + b.amount, 0);
  const perPerson = p.members.length > 0 ? (total / p.members.length) : 0;
  document.getElementById('room-total').textContent = '¥' + total;
  document.getElementById('room-perperson').textContent = '人均 ¥' + perPerson.toFixed(1);

  // 成员头像（可点击）
  document.getElementById('room-members').innerHTML = p.members.map(id => {
    const u = findUser(id);
    const char = u ? (u.avatar || u.username.charAt(0)) : '?';
    return `<span class="avatar" onclick="showMemberInfo('${id}')" style="background:${u && u.avatarBg ? u.avatarBg : 'rgba(255,255,255,.25)'};">${char}</span>`;
  }).join('');

  // 分类汇总
  const cats = {};
  p.bills.forEach(b => { cats[b.tag] = (cats[b.tag] || 0) + b.amount; });
  const catSum = document.getElementById('room-category-summary');
  if (Object.keys(cats).length > 0) {
    catSum.innerHTML = Object.entries(cats).map(([tag, amt]) =>
      `<span class="badge" style="background:rgba(255,255,255,.15);color:#fff;">${catEmojis[tag]||'📦'} ${tag} ¥${amt}</span>`
    ).join('');
    if (p.settled) catSum.innerHTML += '<span class="badge" style="background:#e8f8e8;color:#34c759;margin-left:6px;">✅ 已结算</span>';
  } else {
    catSum.innerHTML = '';
  }

  // 账单列表 - 分"我付的" / "别人帮我付"
  const list = document.getElementById('bill-list');
  if (p.bills.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:60px 0;">还没有账单<br><span style="font-size:32px;display:block;margin-bottom:12px;">📋</span>点击下方 ＋ 记一笔</p>';
    return;
  }

  const myId = DB.currentUser.id;
  const myPaid = p.bills.filter(b => (b.payers || [b.payer]).includes(myId));
  const othersPaid = p.bills.filter(b => !(b.payers || [b.payer]).includes(myId));

  function renderBillItem(b) {
    const payers = b.payers || [b.payer];
    const payerNames = payers.map(id => { const u = findUser(id); return u ? u.username.charAt(0) : '?'; }).join('+');
    const iconCls = catIconCls[b.tag] || 'other';
    return `<div class="bill-item" onclick="navigate('#bill/${pid}/detail/${b.id}')">
      <div class="type-icon ${iconCls}">${catEmojis[b.tag]||'📦'}</div>
      <div class="info">
        <div class="top"><span class="name">${b.note || b.tag}</span><span class="cost">¥${b.amount}</span></div>
        <div class="meta">${payerNames} 付 · ${b.split.length}人分摊</div>
      </div>
    </div>`;
  }

  let html = '';
  if (myPaid.length > 0) {
    html += '<div class="bill-section"><div class="bill-section-title">我付的</div>' + myPaid.map(renderBillItem).join('') + '</div>';
  }
  if (othersPaid.length > 0) {
    html += '<div class="bill-section"><div class="bill-section-title">别人帮我付</div>' + othersPaid.map(renderBillItem).join('') + '</div>';
  }
  list.innerHTML = html;
}

function createNumpad() {
  // 移除旧键盘
  const oldPad = document.getElementById('numpad');
  if (oldPad) oldPad.remove();

  const pad = document.createElement('div');
  pad.id = 'numpad';
  pad.className = 'numpad';
  pad.innerHTML = `
    <button class="numpad-key" onclick="numpadInput('1')">1</button>
    <button class="numpad-key" onclick="numpadInput('2')">2</button>
    <button class="numpad-key" onclick="numpadInput('3')">3</button>
    <button class="numpad-key fn" onclick="numpadDelete()">⌫</button>
    <button class="numpad-key" onclick="numpadInput('4')">4</button>
    <button class="numpad-key" onclick="numpadInput('5')">5</button>
    <button class="numpad-key" onclick="numpadInput('6')">6</button>
    <button class="numpad-key fn" onclick="numpadClear()">C</button>
    <button class="numpad-key" onclick="numpadInput('7')">7</button>
    <button class="numpad-key" onclick="numpadInput('8')">8</button>
    <button class="numpad-key" onclick="numpadInput('9')">9</button>
    <button class="numpad-key confirm" onclick="numpadConfirm()">确定</button>
    <button class="numpad-key dot" onclick="numpadInput('.')">.</button>
    <button class="numpad-key" onclick="numpadInput('0')">0</button>
    <button class="numpad-key" onclick="numpadInput('00')">00</button>
    <button class="numpad-key fn" onclick="numpadHide()">收起</button>
  `;
  document.body.appendChild(pad);
  return pad;
}

var numpadValue = '';

function numpadInput(d) {
  const display = document.getElementById('bill-amount-display-main');
  const isStep2 = document.getElementById('bill-step-amount').style.display === 'none';
  if (isStep2) return;
  
  if (d === '.' && numpadValue.includes('.')) return;
  if (d === '00' && (numpadValue === '' || numpadValue === '0')) { numpadValue = '0'; }
  else if (numpadValue === '0' && d !== '.') { numpadValue = d; }
  else { numpadValue += d; }
  
  // 限制小数点后2位
  const parts = numpadValue.split('.');
  if (parts.length > 1 && parts[1].length > 2) { numpadValue = parts[0] + '.' + parts[1].slice(0,2); }
  
  display.textContent = numpadValue || '0';
}

function numpadDelete() {
  if (document.getElementById('bill-step-amount').style.display === 'none') return;
  numpadValue = numpadValue.slice(0, -1);
  document.getElementById('bill-amount-display-main').textContent = numpadValue || '0';
}

function numpadClear() {
  if (document.getElementById('bill-step-amount').style.display === 'none') return;
  numpadValue = '';
  document.getElementById('bill-amount-display-main').textContent = '0';
}

function numpadConfirm() {
  if (document.getElementById('bill-step-amount').style.display === 'none') return;
  const amount = parseFloat(numpadValue);
  if (!amount || amount <= 0) return showToast('请输入有效金额');
  billDraft.amount = amount;
  document.getElementById('bill-step-amount').style.display = 'none';
  document.getElementById('bill-step-detail').style.display = '';
  document.getElementById('bill-amount-display').textContent = amount;
  // 收起键盘
  const pad = document.getElementById('numpad');
  if (pad) pad.style.display = 'none';
}

function numpadHide() {
  const pad = document.getElementById('numpad');
  if (pad) pad.style.display = 'none';
}

function showNumpad() {
  let pad = document.getElementById('numpad');
  if (!pad) pad = createNumpad();
  pad.style.display = 'grid';
  numpadValue = '';
  document.getElementById('bill-amount-display-main').textContent = '0';
}

function showPayerPicker() {
  const p = findProject(getCurrentProjectId());

  showMemberPicker(p.members.filter(function(id) { return !currentPayers.includes(id); }), function(selected) {

function showSplitPicker() {
  const p = findProject(getCurrentProjectId());
  if (!p) return;
  const currentSplit = billDraft.customSplit || p.members.slice();
  showMemberPicker(p.members.filter(function(id) { return !currentSplit.includes(id); }), function(selected) {
    billDraft.customSplit = currentSplit.concat(selected);

function showMemberPicker(availableIds, onDone) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  const users = availableIds.map(function(id) { return findUser(id); }).filter(Boolean);
  if (users.length === 0) return showToast('没有更多成员可添加');

  var html = '<h3>选择成员</h3>';
  users.forEach(function(u) {
    var char = u.avatar || u.username.charAt(0);
    html += '<label style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="togglePickerCheck(this)">';
    html += '<input type="checkbox" data-id="' + u.id + '" style="width:18px;height:18px;accent-color:var(--primary);pointer-events:none;">';
    html += '<span style="width:36px;height:36px;border-radius:50%;background:' + (u.avatarBg || 'var(--primary-light)') + ';display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--primary);">' + char + '</span>';
    html += '<span style="font-size:15px;">' + u.username + '</span></label>';
  });
  html += '<button class="btn btn-primary" style="margin-top:16px;" onclick="confirmMemberPicker()">确定添加</button>';
  content.innerHTML = html;
  window._pickerOnDone = onDone;
  overlay.classList.add('show');

function togglePickerCheck(el) {
  var cb = el.querySelector('input[type=checkbox]');
  if (cb) cb.checked = !cb.checked;
}

function confirmMemberPicker() {
  var checks = document.querySelectorAll('#modal-content input[type=checkbox]:checked');
  var selected = [];
  checks.forEach(function(c) { selected.push(c.dataset.id); });
  if (selected.length === 0) return showToast('请选择至少一人');
  if (window._pickerOnDone) window._pickerOnDone(selected);

function saveBill() {
  const pid = getCurrentProjectId();
  const p = findProject(pid);
  if (!p) return;

  const amount = billDraft.amount;
  const tag = (document.querySelector('#bill-tags .tag.selected') && document.querySelector('#bill-tags .tag.selected').dataset && document.querySelector('#bill-tags .tag.selected').dataset.tag) || '其他';
  const note = document.getElementById('bill-note').value.trim() || tag;
  const payers = billDraft.payers || [DB.currentUser.id];
  const payer = payers[0];
  var split;
  if (document.getElementById('bill-split-all').checked) {
    split = p.members.slice();
  } else {
    split = billDraft.customSplit || p.members.slice();
  }

  if (split.length === 0) return showToast('请选择至少一人分摊');

  const bill = {
    id: 'b' + Date.now(),
    amount: amount, tag: tag, payer: payer, payers: payers,
    split: split, note: note,
    createdBy: DB.currentUser.id,
    createdAt: formatTime(new Date())
  };
  p.bills.push(bill);
  p.logs.push({ time: formatTime(new Date()), text: DB.currentUser.username + ' 添加了账单「' + note + ' ¥' + amount + '」' });
  saveDB();
  showToast('已保存');
}

function renderBillDetail() {
  window._billEditMode = false;
  document.getElementById('bill-edit-btn').textContent = '编辑';

  const m = hash.match(/bill\/([^/]+)\/detail\/([^/]+)/);
  if (!m) return;
  const pid = m[1], bid = m[2];
  const p = findProject(pid);
  if (!p) return;
  const bill = p.bills.find(function(b) { return b.id === bid; });
  if (!bill) return;

  // 显示编辑按钮（仅创建者可见）
  document.getElementById('bill-edit-btn').style.display = (bill.createdBy === DB.currentUser.id) ? '' : 'none';

  split = split.filter(function(sid) { return sid !== id; });
  window._editBillDraft.split = split;
  editRenderSplitRow(document.getElementById('edit-split-row'), p, split);
}

function editShowPayerPicker() {
  var p = findProject(getCurrentProjectId());
  if (!p) return;
  var currentPayers = window._editBillDraft.payers;
  showMemberPickerEx(p.members.filter(function(id) { return !currentPayers.includes(id); }), function(selected) {
    window._editBillDraft.payers = currentPayers.concat(selected);
    editRenderPayerRow(document.getElementById('edit-payer-row'), p, window._editBillDraft.payers);
  });
}

function editShowSplitPicker() {
  var p = findProject(getCurrentProjectId());
  if (!p) return;
  var currentSplit = window._editBillDraft.split;
  showMemberPickerEx(p.members.filter(function(id) { return !currentSplit.includes(id); }), function(selected) {
    window._editBillDraft.split = currentSplit.concat(selected);
    editRenderSplitRow(document.getElementById('edit-split-row'), p, window._editBillDraft.split);
  });
}

function showMemberPickerEx(availableIds, onDone) {
  var overlay = document.getElementById('modal-overlay');
  var content = document.getElementById('modal-content');
  var users = availableIds.map(function(id) { return findUser(id); }).filter(Boolean);
  if (users.length === 0) return showToast('没有更多成员可添加');
  var html = '<h3>选择成员</h3>';
  users.forEach(function(u) {
    var char = u.avatar || u.username.charAt(0);
    html += '<label style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="togglePickerCheck(this)">';
    html += '<input type="checkbox" data-id="' + u.id + '" style="width:18px;height:18px;accent-color:var(--primary);pointer-events:none;">';
    html += '<span style="width:36px;height:36px;border-radius:50%;background:' + (u.avatarBg || 'var(--primary-light)') + ';display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--primary);">' + char + '</span>';
    html += '<span style="font-size:15px;">' + u.username + '</span></label>';
  });
  html += '<button class="btn btn-primary" style="margin-top:16px;" onclick="confirmMemberPickerEx()">确定添加</button>';
  content.innerHTML = html;
  window._pickerOnDone = onDone;
  overlay.classList.add('show');
}

function confirmMemberPickerEx() {
  var checks = document.querySelectorAll('#modal-content input[type=checkbox]:checked');
  var selected = [];
  checks.forEach(function(c) { selected.push(c.dataset.id); });
  if (selected.length === 0) return showToast('请选择至少一人');
  if (window._pickerOnDone) window._pickerOnDone(selected);
  document.getElementById('modal-overlay').classList.remove('show');
}

function saveBillEdit() {
  const hash = window.location.hash;
  const m = hash.match(/bill\/([^/]+)\/detail\/([^/]+)/);
  if (!m) return;
  const pid = m[1], bid = m[2];
  const p = findProject(pid);
  if (!p) return;
  const bill = p.bills.find(function(b) { return b.id === bid; });
  if (!bill) return;

  var newAmount = window._editingBillAmount;
  var newTag = window._editingBillTag || bill.tag;
  var newNote = document.getElementById('edit-note').value.trim() || bill.tag;
  var newPayers = window._editBillDraft ? window._editBillDraft.payers : null;
  var newSplit = window._editBillDraft ? window._editBillDraft.split : null;

  if (!newAmount || newAmount <= 0) return showToast('请输入有效金额');

  bill.amount = newAmount;
  bill.tag = newTag;
  bill.note = newNote;
  if (newPayers) { bill.payers = newPayers; bill.payer = newPayers[0]; }
  if (newSplit) bill.split = newSplit;
  p.logs.push({ time: formatTime(new Date()), text: DB.currentUser.username + ' 修改了账单「' + bill.note + ' ¥' + newAmount + '」' });
  saveDB();
  showToast('已保存');
  window._billEditMode = false;
  document.getElementById('bill-edit-btn').textContent = '编辑';
  renderBillDetailContent(bill, p);
}

function deleteBill() {
  if (!confirm('确认删除此账单？')) return;
  const hash = window.location.hash;
  const m = hash.match(/bill\/([^/]+)\/detail\/([^/]+)/);
  if (!m) return;
  const pid = m[1], bid = m[2];
  const p = findProject(pid);
  if (!p) return;
  const idx = p.bills.findIndex(function(b) { return b.id === bid; });
  if (idx === -1) return;
  const bill = p.bills[idx];
  if (bill.createdBy !== DB.currentUser.id && DB.currentUser.role !== 'admin' && p.createdBy !== DB.currentUser.id) {
    return showToast('无权删除此账单');
  }
  p.bills.splice(idx, 1);
  p.logs.push({ time: formatTime(new Date()), text: DB.currentUser.username + ' 删除了账单「' + bill.note + '」' });
  saveDB();
  showToast('已删除');
  navigateToRoom();
}

// ============================================
// Settle
// ============================================
function navigateToSettle() {
  const pid = getCurrentProjectId();
  navigate('#settle/' + pid);
}

function renderSettle() {
  const hash = window.location.hash;
  const m = hash.match(/settle\/([^/]+)/);
  const pid = m ? m[1] : getCurrentProjectId();
  const p = findProject(pid);
  if (!p || p.bills.length === 0) {
    document.getElementById('settle-total').textContent = '¥0';
    document.getElementById('settle-perperson').textContent = '暂无账单';
    document.getElementById('settle-detail').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:40px 0;">还没有账单</p>';
    document.getElementById('transfer-list').innerHTML = '';
    return;
  }

  const total = p.bills.reduce(function(s, b) { return s + b.amount; }, 0);
  const perPerson = total / p.members.length;
  document.getElementById('settle-total').textContent = '¥' + total;
  document.getElementById('settle-perperson').textContent = '人均 ¥' + perPerson.toFixed(1);
  document.getElementById('settle-done-check').checked = p.settled;

  const stats = {};
  p.members.forEach(function(id) { stats[id] = { paid: 0, share: 0 }; });
  p.bills.forEach(function(b) {
    if (stats[b.payer]) stats[b.payer].paid += b.amount;
    const perShare = b.amount / b.split.length;
    b.split.forEach(function(id) { if (stats[id]) stats[id].share += perShare; });
  });

  document.getElementById('settle-detail').innerHTML = p.members.map(function(id) {
    const u = findUser(id);
    const s = stats[id];
    if (!u || !s) return '';
    const balance = s.paid - s.share;
    const isGet = balance > 0;
    return '<div class="person-card"><div class="header"><span class="name">' + u.username + (id === p.createdBy ? ' 👑' : '') + '</span><span class="status ' + (isGet ? 'get' : 'pay') + '">' + (isGet ? '💰 应收 ¥' + balance.toFixed(1) : '💸 应付 ¥' + Math.abs(balance).toFixed(1)) + '</span></div><div class="details">付了 ¥' + s.paid.toFixed(1) + ' · 应摊 ¥' + s.share.toFixed(1) + '</div></div>';
  }).join('');

  const transfers = calculateTransfers(p.members.map(function(id) {
    return { id: id, balance: (stats[id]?.paid || 0) - (stats[id]?.share || 0) };
  }));
  const transferDiv = document.getElementById('transfer-list');
  if (transfers.length === 0) {
    transferDiv.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:20px 0;">无需转账，已两清</p>';
  } else {
    transferDiv.innerHTML = transfers.map(function(t) {
      const from = findUser(t.from);
      const to = findUser(t.to);
      return '<div class="transfer-item"><span class="from">' + (from ? from.username : '?') + '</span><span class="arrow">→</span><span class="to">' + (to ? to.username : '?') + '</span><span class="amount">¥' + t.amount.toFixed(1) + '</span></div>';
    }).join('');
  }
}

function calculateTransfers(balances) {
  var pos = balances.filter(function(b) { return b.balance > 0; }).sort(function(a, b) { return b.balance - a.balance; });
  var neg = balances.filter(function(b) { return b.balance < 0; }).sort(function(a, b) { return a.balance - b.balance; });
  var transfers = [];
  var i = 0, j = 0;
  while (i < pos.length && j < neg.length) {
    var amount = Math.min(pos[i].balance, -neg[j].balance);
    if (amount > 0.01) {
      transfers.push({ from: neg[j].id, to: pos[i].id, amount: Math.round(amount * 100) / 100 });
    }
    pos[i].balance -= amount;
    neg[j].balance += amount;
    if (pos[i].balance < 0.01) i++;
    if (neg[j].balance > -0.01) j++;
  }
  return transfers;
}

function toggleSettleDone() {
  const pid = getCurrentProjectId();
  const p = findProject(pid);
  if (!p) return;
  p.settled = document.getElementById('settle-done-check').checked;
  p.logs.push({ time: formatTime(new Date()), text: DB.currentUser.username + (p.settled ? ' 标记了已结算' : ' 取消了结算标记') });
  saveDB();
  showToast(p.settled ? '已标记结算' : '已取消结算标记');
}

function copySettleText() {
  const pid = getCurrentProjectId();
  const p = findProject(pid);
  if (!p) return;
  const total = p.bills.reduce(function(s, b) { return s + b.amount; }, 0);
  const perPerson = total / p.members.length;
  var text = '📊 ' + p.name + ' 结算结果\n总支出：¥' + total + ' | 人均：¥' + perPerson.toFixed(1) + '\n\n';

  const stats = {};
  p.members.forEach(function(id) { stats[id] = { paid: 0, share: 0 }; });
  p.bills.forEach(function(b) {
    if (stats[b.payer]) stats[b.payer].paid += b.amount;
    const perShare = b.amount / b.split.length;
    b.split.forEach(function(id) { if (stats[id]) stats[id].share += perShare; });
  });

  p.members.forEach(function(id) {
    const u = findUser(id);
    const s = stats[id];
    if (!u || !s) return;
    const balance = s.paid - s.share;
    text += u.username + '：付了¥' + s.paid.toFixed(1) + '，应摊¥' + s.share.toFixed(1) + '，' + (balance >= 0 ? '应收' : '应付') + '¥' + Math.abs(balance).toFixed(1) + '\n';
  });

  text += '\n💡 转账方案：\n';
  const transfers = calculateTransfers(p.members.map(function(id) {
    return { id: id, balance: (stats[id]?.paid || 0) - (stats[id]?.share || 0) };
  }));
  transfers.forEach(function(t) {
    const from = findUser(t.from);
    const to = findUser(t.to);
    text += (from ? from.username : '?') + ' → ' + (to ? to.username : '?') + '：¥' + t.amount.toFixed(1) + '\n';
  });

  navigator.clipboard.writeText(text).then(function() { showToast('结算结果已复制'); }).catch(function() { showToast('复制失败'); });
}

// Logs

function renderLogs(pid) {
  const p = findProject(pid);
  if (!p) { document.getElementById('log-list').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:40px 0;">请先进入一个项目</p>'; return; }
  document.getElementById('log-list').innerHTML = p.logs.slice().reverse().map(function(l) {
    return '<div class="log-item"><span class="time">' + l.time + '</span><span class="content">' + l.text + '</span></div>';

function saveAdminPassword(userId) {

// ============================================
// Utils
// ============================================
function copyText(text) {
  navigator.clipboard.writeText(text).then(function() {
    showToast('已复制到剪贴板');
  }).catch(function() {
    showToast('复制失败，请手动复制');
  });
}

function formatTime(d) {
  var pad = function(n) { return String(n).padStart(2,'0'); };
  return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}
